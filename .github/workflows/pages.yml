# מפרסם את תיקיית site ל־GitHub Pages בכל push ל־main
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node site/check.js
      # גרסה בכתובות של ה־JS/CSS, כדי שדפדפנים לא ישתמשו בקוד ישן מהמטמון; version.txt — דף פתוח בודק אותו ומתרענן
      - run: |
          V=${GITHUB_SHA::8}
          sed -i "s/?v=dev/?v=$V/g" site/index.html
          echo -n "$V" > site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
